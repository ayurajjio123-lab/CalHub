workflows:
  android-workflow:
    name: CalcHub Android Build
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Verify build tools
        script: |
          java -version
          gradle --version
      - name: Build debug APK
        script: |
          gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
